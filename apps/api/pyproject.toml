[project]
name = "billing-platform-api"
version = "0.1.0"
description = "API fina do painel FinOps do CI Polaris — lê as views rpt_* no BigQuery"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "google-cloud-bigquery>=3.27",
  "pyyaml>=6.0",
  # aba ADM (budget/e-mail + relatório semanal)
  "google-cloud-firestore>=2.19",
  "google-auth>=2.34",
  "matplotlib>=3.9",
  # login OAuth (por cima do IAP, ver oauth_session.py)
  "authlib>=1.3",
  "python-jose[cryptography]>=3.3",
  "google-cloud-secret-manager>=2.20",
  "requests>=2.32",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff==0.8.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Conjunto enxuto: pyflakes + isort + pyupgrade. E501/estilo e RUF002 (traco unicode em
# docstring PT-BR) ficam de fora; B008 (Query()/Depends() em default) e idioma do FastAPI.
# O passo de lint no CI e advisory (continue-on-error) ate uma limpeza dedicada.
select = ["F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billing_api"]
